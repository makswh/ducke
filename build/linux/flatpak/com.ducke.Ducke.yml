app-id: com.ducke.Ducke
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: Ducke

finish-args:
  # Display & GPU
  - --socket=x11
  - --socket=wayland
  - --device=all
  - --share=ipc
  # Audio
  - --socket=pulseaudio
  # Network
  - --share=network
  # Gamepad and Full Host Filesystem Access (for external drives, SD cards, and custom game install dirs)
  - --filesystem=host
  - --filesystem=xdg-run/gamepad
  # Desktop notifications and host spawning (for running game installers)
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: ducke
    buildsystem: simple
    build-commands:
      - install -D -m 755 Ducke /app/bin/Ducke
      - install -D -m 644 com.ducke.Ducke.desktop /app/share/applications/com.ducke.Ducke.desktop
      - install -D -m 644 com.ducke.Ducke.metainfo.xml /app/share/metainfo/com.ducke.Ducke.metainfo.xml
      - install -D -m 644 icons/32x32.png /app/share/icons/hicolor/32x32/apps/com.ducke.Ducke.png
      - install -D -m 644 icons/64x64.png /app/share/icons/hicolor/64x64/apps/com.ducke.Ducke.png
      - install -D -m 644 icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.ducke.Ducke.png
      - install -D -m 644 icons/256x256.png /app/share/icons/hicolor/256x256/apps/com.ducke.Ducke.png
      - install -D -m 644 icons/512x512.png /app/share/icons/hicolor/512x512/apps/com.ducke.Ducke.png
      - install -D -m 755 lib/libopenh264.so.2.4.1 /app/lib/libopenh264.so.2.4.1
      - ln -sf libopenh264.so.2.4.1 /app/lib/libopenh264.so.7
      - ln -sf libopenh264.so.2.4.1 /app/lib/libopenh264.so
    sources:
      - type: file
        path: ../../bin/Ducke
      - type: file
        path: com.ducke.Ducke.desktop
      - type: file
        path: com.ducke.Ducke.metainfo.xml
      - type: dir
        path: icons
        dest: icons
      - type: dir
        path: lib
        dest: lib
